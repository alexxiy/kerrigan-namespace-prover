[package]
version = "0.1.0"
name = "kns-program"
edition = "2021"

[dependencies]
# --- Core SP1 SDK ---
sp1-zkvm = "6.9.0"

# --- Shared Protocol Logic (structs, hashing, SMT, signed messages) ---
kns-core = { path = "../kns-core" }

# --- Data Serialization ---
serde = { version = "1.0", features = ["derive"] }

# --- Smart Contract ABI ---
alloy-sol-types = { version = "1.7.3", default-features = false }

# --- Cryptography (Optimized for ZKVM) ---
ed25519-dalek = { version = "2", default-features = false }

[features]
default = []
# Builds a testnet circuit: `tKNS:` signed-message prefix and testnet (`ktestsapling1…`)
# Sapling addresses. Produces a distinct vKey, so testnet proofs are not
# interchangeable with mainnet ones.
testnet = ["kns-core/testnet"]
