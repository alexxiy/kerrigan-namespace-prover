[package]
version = "0.1.0"
name = "kns-script"
edition = "2021"

[dependencies]
# --- Core SP1 SDK ---
sp1-sdk = { version = "6.9.0", features = ["network"] }

# --- Shared Protocol Logic (structs, hashing, SMT, signed messages) ---
# reference-tree gives the fixture generator an in-memory canonical tree to build
# batches against, without needing a running rr-proxy daemon.
kns-core = { path = "../kns-core", features = ["reference-tree"] }

# --- Data Serialization ---
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# --- Fixture generation (signing keys and well-formed Sapling addresses) ---
ed25519-dalek = "2"
# Encodes the fixture's target addresses. Same crate and version the guest validates
# with, so the generator cannot produce an address kns-core would refuse.
bech32 = "0.9"

# --- Smart Contract Integration ---
alloy-sol-types = "1.7.3"
hex = "0.4"

# --- CLI & Async Runtime ---
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"

# --- Logging & Tracing ---
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"

[features]
default = []
# Builds the host side against the testnet protocol, so `gen_fixture` emits `ktestsapling1…`
# addresses and the `tKNS:` signed-message prefix. Without this the generator can only
# ever produce mainnet fixtures, and the round-trip check - the end-to-end test that the
# generator, kns-core and the circuit agree - cannot be run on testnet at all.
#
# Pair it with a matching guest: `cargo prove build --features testnet`.
testnet = ["kns-core/testnet"]

[build-dependencies]
sp1-build = { version = "6.9.0" }
